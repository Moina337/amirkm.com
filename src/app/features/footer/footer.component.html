<footer class="border-t border-line py-8">
  <div class="max-w-content mx-auto px-6 md:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
    <p class="text-sm text-muted">© {{ year }} Amir Soilihi</p>

    <div class="flex items-center gap-5 text-sm text-muted" *ngIf="social$ | async as social">
      <ng-container *ngFor="let link of social; let last = last">
        <a
          [href]="link.href"
          [target]="link.platform === 'email' ? null : '_blank'"
          [rel]="link.platform === 'email' ? null : 'noopener noreferrer'"
          class="inline-flex items-center gap-2 hover:text-accent transition-colors"
        >
          <app-social-icon [icon]="link.icon"></app-social-icon>
          {{ link.label }}
        </a>
        <span *ngIf="!last" class="text-line">·</span>
      </ng-container>
    </div>
  </div>
</footer>
