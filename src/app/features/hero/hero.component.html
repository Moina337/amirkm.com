<section id="accueil" class="relative pt-32 pb-20 md:pt-44 md:pb-28" *ngIf="hero$ | async as hero">
  <div class="max-w-content mx-auto px-6 md:px-8 grid md:grid-cols-[1.4fr_0.6fr] gap-14 items-center">

    <div>
      <p class="font-mono text-xs tracking-[0.18em] uppercase text-accent mb-5">
        {{ hero.role }}
      </p>

      <h1 class="font-display font-semibold text-ink text-[2.5rem] leading-[1.1] md:text-6xl md:leading-[1.05] tracking-tight">
        {{ hero.name }}
      </h1>

      <p class="mt-6 text-lg md:text-xl text-muted max-w-xl leading-relaxed">
        {{ hero.tagline }}
      </p>

      <div class="mt-9 flex flex-wrap items-center gap-4">
        <a
          href="#projets"
          class="inline-flex items-center px-5 py-3 rounded-md bg-accent text-bg text-sm font-medium hover:bg-accent-hover transition-colors"
        >
          {{ hero.primaryCta }}
        </a>
        <a
          href="#contact"
          class="inline-flex items-center px-5 py-3 rounded-md border border-line text-ink text-sm font-medium hover:border-accent hover:text-accent transition-colors"
        >
          {{ hero.secondaryCta }}
        </a>
      </div>
    </div>

    <div class="w-full max-w-[200px] md:max-w-[240px] mx-auto md:justify-self-end">
      <app-hero-visual [image]="hero.visualImage" [alt]="hero.name"></app-hero-visual>
    </div>

  </div>
</section>
