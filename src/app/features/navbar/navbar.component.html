<header
  class="fixed top-0 inset-x-0 z-50 transition-colors duration-300 border-b"
  [class.bg-bg]="isScrolled"
  [class.border-line]="isScrolled"
  [class.border-transparent]="!isScrolled"
>
  <nav class="max-w-content mx-auto px-6 md:px-8 flex items-center justify-between h-16" aria-label="Navigation principale">
    <a href="#accueil" class="font-display font-semibold text-lg text-ink tracking-tight">
      Amir<span class="text-accent">.</span>
    </a>

    <ul class="hidden md:flex items-center gap-8">
      <li *ngFor="let link of links">
        <a
          [href]="link.href"
          class="text-sm text-muted hover:text-ink transition-colors"
        >{{ link.label }}</a>
      </li>
    </ul>

    <a
      href="#contact"
      class="hidden md:inline-flex items-center px-4 py-2 text-sm font-medium rounded-md bg-accent text-bg hover:bg-accent-hover transition-colors"
    >
      Me contacter
    </a>

    <button
      type="button"
      class="md:hidden inline-flex items-center justify-center w-10 h-10 text-ink"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="isMobileMenuOpen"
      aria-label="Ouvrir le menu"
    >
      <svg *ngIf="!isMobileMenuOpen" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <svg *ngIf="isMobileMenuOpen" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <line x1="5" y1="5" x2="19" y2="19"/>
        <line x1="19" y1="5" x2="5" y2="19"/>
      </svg>
    </button>
  </nav>

  <div
    *ngIf="isMobileMenuOpen"
    class="md:hidden bg-bg border-t border-line px-6 py-4"
  >
    <ul class="flex flex-col gap-1">
      <li *ngFor="let link of links">
        <a
          [href]="link.href"
          (click)="closeMobileMenu()"
          class="block py-2.5 text-base text-muted hover:text-ink transition-colors"
        >{{ link.label }}</a>
      </li>
    </ul>
  </div>
</header>
