<article class="pt-28 pb-20 md:pt-36 md:pb-28" *ngIf="project$ | async as project">
  <div class="max-w-content mx-auto px-6 md:px-8">

    <a routerLink="/" fragment="projets" class="inline-flex items-center gap-2 text-sm text-muted hover:text-accent transition-colors mb-8">
      ← Retour aux projets
    </a>

    <p class="font-mono text-xs tracking-[0.18em] uppercase text-accent mb-3">{{ project.type }}</p>
    <h1 class="font-display text-3xl md:text-5xl font-semibold text-ink mb-6">{{ project.title }}</h1>

    <div class="aspect-[16/9] rounded-lg overflow-hidden bg-surface border border-line mb-10">
      <img [src]="project.image" [alt]="'Aperçu du projet ' + project.title" class="w-full h-full object-cover" />
    </div>

    <div class="grid md:grid-cols-[1fr_0.6fr] gap-12">
      <div>
        <p class="text-lg text-ink leading-relaxed mb-8">
          {{ project.descriptionDetaillee || project.description }}
        </p>

        <div *ngIf="project.objectif" class="mb-8">
          <h2 class="font-display text-xl font-semibold text-ink mb-3">Objectif</h2>
          <p class="text-muted leading-relaxed">{{ project.objectif }}</p>
        </div>

        <div *ngIf="project.fonctionnalites?.length" class="mb-8">
          <h2 class="font-display text-xl font-semibold text-ink mb-3">Fonctionnalités</h2>
          <ul class="space-y-2">
            <li *ngFor="let f of project.fonctionnalites" class="flex gap-3 text-muted">
              <span class="text-accent">→</span>{{ f }}
            </li>
          </ul>
        </div>

        <div *ngIf="project.architectureImage" class="mb-8">
          <h2 class="font-display text-xl font-semibold text-ink mb-3">Architecture</h2>
          <div class="rounded-lg overflow-hidden border border-line bg-surface">
            <img [src]="project.architectureImage" alt="Schéma d'architecture" class="w-full h-auto" />
          </div>
        </div>

        <div *ngIf="images$ | async as images" class="mb-8">
          <h2 *ngIf="images.length" class="font-display text-xl font-semibold text-ink mb-3">Galerie</h2>
          <div class="grid grid-cols-2 gap-3">
            <figure *ngFor="let img of images" class="rounded-lg overflow-hidden border border-line bg-surface">
              <img [src]="img.image" [alt]="img.legende || project.title" class="w-full h-full object-cover" />
              <figcaption *ngIf="img.legende" class="text-xs text-muted p-2">{{ img.legende }}</figcaption>
            </figure>
          </div>
        </div>
      </div>

      <aside class="md:sticky md:top-24 self-start">
        <div class="border border-line rounded-lg p-5 bg-surface">
          <p class="font-mono text-xs text-muted mb-3">Technologies</p>
          <div class="flex flex-wrap gap-2 mb-6">
            <span *ngFor="let tech of project.technologies" class="text-[11px] font-mono px-2 py-1 rounded border border-line text-accent">{{ tech }}</span>
          </div>

          <a *ngIf="project.url" [href]="project.url" target="_blank" rel="noopener noreferrer"
             class="block text-center px-4 py-2.5 rounded-md bg-accent text-bg text-sm font-medium hover:bg-accent-hover transition-colors mb-3">
            Voir le projet en ligne
          </a>
          <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank" rel="noopener noreferrer"
             class="block text-center px-4 py-2.5 rounded-md border border-line text-ink text-sm font-medium hover:border-accent hover:text-accent transition-colors">
            Voir le code sur GitHub
          </a>
        </div>
      </aside>
    </div>

  </div>
</article>
