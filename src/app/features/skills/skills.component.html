<section id="competences" class="py-20 md:py-24 border-t border-line bg-surface">
  <div class="max-w-content mx-auto px-6 md:px-8 mb-10">
    <p class="font-mono text-xs tracking-[0.18em] uppercase text-accent mb-3">Compétences</p>
    <h2 class="font-display text-2xl md:text-3xl font-semibold text-ink">
      Technologies que j'utilise
    </h2>
  </div>

  <div class="relative overflow-hidden py-2" role="list" aria-label="Liste des technologies">
    <div class="absolute inset-y-0 left-0 w-16 md:w-32 bg-gradient-to-r from-surface to-transparent z-10 pointer-events-none"></div>
    <div class="absolute inset-y-0 right-0 w-16 md:w-32 bg-gradient-to-l from-surface to-transparent z-10 pointer-events-none"></div>

    <div class="marquee-track flex items-center gap-5 w-max" *ngIf="loop$ | async as loop">
      @for (skill of loop; track $index) {
        <div
          role="listitem"
          class="flex h-32 w-32 flex-col items-center justify-center gap-3 rounded-lg border border-line bg-bg/60 px-3 py-4 text-center text-ink/80 transition-colors hover:border-accent/60 hover:text-accent"
        >
          <app-social-icon [icon]="skill.icon" class="flex items-center justify-center text-ink"></app-social-icon>
          <span class="font-display text-sm md:text-base leading-tight whitespace-normal">{{ skill.name }}</span>
        </div>
      }
    </div>
  </div>
</section>
