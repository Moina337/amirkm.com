<div class="flex items-center justify-between mb-6">
  <h1 class="font-display text-2xl font-semibold text-ink">Centres d'intérêt</h1>
  <button
    *ngIf="editingId === null && form.title === ''"
    (click)="form = { title: '', description: '', isActive: true }"
    class="px-4 py-2 rounded-md bg-accent text-bg text-sm font-medium hover:bg-accent-hover"
  >
    + Nouveau
  </button>
</div>

<form (ngSubmit)="save()" class="border border-line rounded-lg p-5 bg-surface mb-8">
  <h2 class="font-display text-lg font-semibold text-ink mb-4">
    {{ editingId ? 'Modifier' : 'Ajouter' }}
  </h2>

  <div class="mb-4">
    <label class="block text-xs font-mono text-muted mb-1">Titre</label>
    <input name="title" [(ngModel)]="form.title" required class="w-full px-3 py-2 rounded-md bg-bg border border-line text-ink text-sm" />
  </div>

  <div class="mb-4">
    <label class="block text-xs font-mono text-muted mb-1">Description</label>
    <textarea name="description" [(ngModel)]="form.description" rows="2" required class="w-full px-3 py-2 rounded-md bg-bg border border-line text-ink text-sm"></textarea>
  </div>

  <label class="flex items-center gap-2 text-sm text-ink mb-4">
    <input type="checkbox" name="isActive" [(ngModel)]="form.isActive" class="accent-accent" />
    Actif (visible sur le site public)
  </label>

  <p *ngIf="error" class="text-sm text-red-400 mb-4">{{ error }}</p>

  <div class="flex gap-2">
    <button type="submit" [disabled]="saving" class="px-4 py-2 rounded-md bg-accent text-bg text-sm font-medium hover:bg-accent-hover disabled:opacity-50">
      {{ saving ? 'Enregistrement...' : (editingId ? 'Modifier' : 'Ajouter') }}
    </button>
    <button *ngIf="editingId" type="button" (click)="cancel()" class="px-4 py-2 rounded-md border border-line text-ink text-sm">Annuler</button>
  </div>
</form>

<table class="w-full text-sm">
  <thead>
    <tr class="text-left text-muted border-b border-line">
      <th class="py-2">Titre</th><th>Description</th><th>Statut</th><th></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let i of interests" class="border-b border-line/50">
      <td class="py-2 text-ink">{{ i.title }}</td>
      <td class="text-muted">{{ i.description }}</td>
      <td>
        <button
          (click)="toggleActive(i)"
          class="px-2 py-1 rounded text-xs font-mono border"
          [class.text-accent]="i.isActive"
          [class.border-accent]="i.isActive"
          [class.text-muted]="!i.isActive"
          [class.border-line]="!i.isActive"
        >
          {{ i.isActive ? 'Actif' : 'Inactif' }}
        </button>
      </td>
      <td class="text-right whitespace-nowrap">
        <button (click)="edit(i)" class="text-accent hover:underline mr-3">Modifier</button>
        <button (click)="remove(i.id)" class="text-red-400 hover:underline">Supprimer</button>
      </td>
    </tr>
  </tbody>
</table>
