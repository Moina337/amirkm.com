<div class="min-h-screen flex items-center justify-center bg-bg px-6">
  <form (ngSubmit)="submit()" class="w-full max-w-sm border border-line rounded-lg p-8 bg-surface">
    <h1 class="font-display text-xl font-semibold text-ink mb-6">Connexion admin</h1>

    <label class="block text-xs font-mono text-muted mb-1">Email</label>
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      required
      class="w-full mb-4 px-3 py-2 rounded-md bg-bg border border-line text-ink text-sm focus:border-accent outline-none"
    />

    <label class="block text-xs font-mono text-muted mb-1">Mot de passe</label>
    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      required
      class="w-full mb-6 px-3 py-2 rounded-md bg-bg border border-line text-ink text-sm focus:border-accent outline-none"
    />

    <p *ngIf="error" class="text-sm text-red-400 mb-4">{{ error }}</p>

    <button
      type="submit"
      [disabled]="loading"
      class="w-full py-2.5 rounded-md bg-accent text-bg text-sm font-medium hover:bg-accent-hover transition-colors disabled:opacity-50"
    >
      {{ loading ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>
</div>
