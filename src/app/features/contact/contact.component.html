<section id="contact" class="py-24 md:py-32 border-t border-line">
  <div class="max-w-content mx-auto px-6 md:px-8">
    <div class="max-w-2xl" *ngIf="contact$ | async as contact">
      <p class="font-mono text-xs tracking-[0.18em] uppercase text-accent mb-3">Contact</p>
      <h2 class="font-display text-3xl md:text-4xl font-semibold text-ink mb-4">
        {{ contact.title }}
      </h2>
      <p class="text-muted text-lg leading-relaxed mb-10">
        {{ contact.text }}
      </p>
    </div>

    <div class="flex flex-wrap gap-4" *ngIf="social$ | async as social">
      <a
        *ngFor="let link of social; let first = first"
        [href]="link.href"
        [target]="link.platform === 'email' ? null : '_blank'"
        [rel]="link.platform === 'email' ? null : 'noopener noreferrer'"
        class="inline-flex items-center gap-2 px-5 py-3 rounded-md text-sm font-medium transition-colors"
        [class.bg-accent]="first"
        [class.text-bg]="first"
        [class.hover:bg-accent-hover]="first"
        [class.border]="!first"
        [class.border-line]="!first"
        [class.text-ink]="!first"
        [class.hover:border-accent]="!first"
        [class.hover:text-accent]="!first"
      >
        <app-social-icon [icon]="link.icon"></app-social-icon>
        {{ link.label }}
      </a>
    </div>
  </div>
</section>
