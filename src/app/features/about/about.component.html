<section id="a-propos" class="py-20 md:py-28 border-t border-line" *ngIf="about$ | async as about">
  <div class="max-w-content mx-auto px-6 md:px-8 grid md:grid-cols-[0.5fr_1fr] gap-10 md:gap-16">

    <div>
      <p class="font-mono text-xs tracking-[0.18em] uppercase text-accent mb-3">À propos</p>
      <h2 class="font-display text-2xl md:text-3xl font-semibold text-ink">
        {{ about.title }}
      </h2>
    </div>

    <div class="max-w-2xl">
      <p
        *ngFor="let paragraph of about.paragraphs; let first = first"
        class="leading-relaxed"
        [class.text-ink]="first"
        [class.text-lg]="first"
        [class.text-muted]="!first"
        [class.mt-5]="!first"
      >{{ paragraph }}</p>
    </div>

  </div>
</section>
