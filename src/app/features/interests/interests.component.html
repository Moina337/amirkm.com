<section id="interets" class="py-20 md:py-28 border-t border-line bg-surface">
  <div class="max-w-content mx-auto px-6 md:px-8">
    <p class="font-mono text-xs tracking-[0.18em] uppercase text-accent mb-3">Centres d'intérêt</p>
    <h2 class="font-display text-2xl md:text-3xl font-semibold text-ink mb-12">
      Ce qui m'anime
    </h2>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4" *ngIf="interests$ | async as interests">
      <div
        *ngFor="let interest of interests"
        class="p-6 bg-bg border border-line rounded-lg hover:border-accent/50 transition-colors"
      >
        <h3 class="font-display text-base font-semibold text-ink mb-2">{{ interest.title }}</h3>
        <p class="text-sm text-muted leading-relaxed">{{ interest.description }}</p>
      </div>
    </div>
  </div>
</section>
